<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#003399">
  <meta name="description" content="Birmingham City fixtures, results, match stats and the Championship table.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Blues">
  <title>Blues tracker</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="shell">
    <header class="top">
      <div class="scarf" aria-hidden="true"></div>
      <div class="top-inner">
        <div class="crest" aria-hidden="true">BC</div>
        <div>
          <p class="eyebrow">Birmingham City</p>
          <h1>Blues tracker</h1>
        </div>
      </div>
    </header>
    <main id="app" class="main">
      <p class="loading">Loading the fixtures…</p>
    </main>
    <nav class="tabs" aria-label="Sections">
      <a href="#home" data-view="home">Home</a>
      <a href="#fixtures" data-view="fixtures">Fixtures</a>
      <a href="#results" data-view="results">Results</a>
      <a href="#table" data-view="table">Table</a>
      <a href="#scorers" data-view="scorers">Scorers</a>
    </nav>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
